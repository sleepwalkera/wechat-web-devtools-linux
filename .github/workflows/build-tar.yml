name: Build tar.gz AppImage

on:
  workflow_call:

jobs:
  build-tar:
    name: Build tar.gz AppImage
    runs-on: ${{ matrix.RUNS_ON }}

    strategy:
      # 多架构构建时互不影响，一个架构失败不取消另一个
      fail-fast: false
      matrix:
        include:
          - ARCH: x86_64
            RUNS_ON: ubuntu-latest
          # appimagetool 有 aarch64 产物，在 arm64 runner 上原生打包
          - ARCH: arm64
            RUNS_ON: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # 只取本架构的构建产物，内容直接解到工作区根目录
          name: wechat-devtools-${{ matrix.ARCH }}.src
      - name: Inspect directory after downloading artifacts
        run: |
          ls -alFR
      - name: Prepare
        run: echo "$(id -u), $(id -g)"

      - name: Generate TAG
        id: tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag='continuous'
          name='Continuous Build'
          if [[ "$IS_TAG" == 'true' ]]; then
            tag="$REF_NAME"
            name="$REF_NAME"
          fi
          echo "tag result: $tag - $name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ACTION_MODE: 'true'
          WINE: 'false'
        run: |
          mkdir -p tmp/build
          tools/build-prepare.sh
          tools/build-release.sh ${{ matrix.ARCH }} ${{ steps.tag.outputs.tag }}

      - name: View Directory
        run: |
          ls -l

      # AppImage 与 tar.gz 分开上传，便于按需只下载其一（避免每次都拖 500MB+）
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-appimage-${{ matrix.ARCH }}.build
          path: tmp/build/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-targz-${{ matrix.ARCH }}.build
          path: tmp/build/*.tar.gz
          if-no-files-found: error
          compression-level: 0
